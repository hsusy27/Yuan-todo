<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yuan 代辦事項 - 智慧工作待辦與日誌匯出系統</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        korean: {
                            bg: '#FAF8F5',
                            card: '#FFFFFF',
                            border: '#F0EAE1',
                            text: '#4A4238',
                            muted: '#9E9488',
                            primary: '#E07A5F',
                            primaryHover: '#D0694E',
                            primarySoft: '#FDF0ED',
                            accent: '#81B29A',
                            accentHover: '#6F9F88',
                            accentSoft: '#F2F7F4',
                            warmYellow: '#F4F1DE',
                            warmYellowDark: '#E0AC00',
                            lavender: '#9D81BA',
                            lavenderSoft: '#F5F2F9'
                        }
                    },
                    borderRadius: {
                        '4xl': '2rem'
                    },
                    boxShadow: {
                        'soft': '0 10px 30px -5px rgba(74, 66, 56, 0.05)',
                        'soft-lg': '0 20px 40px -10px rgba(74, 66, 56, 0.08)'
                    }
                }
            }
        }
    </script>
    
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans TC', 'Inter', system-ui, -apple-system, sans-serif; 
            background-color: #FAF8F5;
            color: #4A4238;
        }
        [v-cloak] { display: none !important; }
        
        .bg-korean-soft { background-color: #FDF0ED; }
        .border-korean-soft { border-color: #F8DCD4; }
        
        /* Custom smooth scrollbar styling */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #F0EAE1;
            border-radius: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #D8CEBE;
            border-radius: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #9E9488;
        }

        /* Auto link styling */
        .note-link { color: #E07A5F; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
        .note-link:hover { color: #D0694E; }

        /* Print Styles for clean Work Log Exports */
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; color: black !important; }
            .print-card { border: 1px solid #E0E0E0 !important; box-shadow: none !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="min-h-screen antialiased selection:bg-[#E07A5F]/20 selection:text-[#E07A5F] flex flex-col">

    <div id="app" v-cloak class="min-h-screen flex flex-col flex-grow">

        <!-- ================= SECURITY LOCK SCREEN ================= -->
        <div v-if="isLocked" class="fixed inset-0 z-50 flex items-center justify-center bg-[#4A4238]/60 backdrop-blur-md p-4">
            <div class="bg-white rounded-3xl shadow-soft-lg p-8 max-w-md w-full border border-[#F0EAE1] text-center space-y-6 animate-fade-in">
                <div class="w-20 h-20 bg-[#FDF0ED] text-[#E07A5F] rounded-3xl flex items-center justify-center mx-auto shadow-inner text-3xl">
                    <i class="fa-solid fa-cat"></i>
                </div>
                <div>
                    <h2 class="text-2xl font-bold text-[#4A4238]">yuan 代辦事項系統</h2>
                    <p class="text-xs text-[#9E9488] mt-1">請輸入安全密碼以存取您的工作日誌與經費對帳</p>
                </div>
                <form @submit.prevent="verifyPassword" class="space-y-4">
                    <div class="relative">
                        <input :type="showPassword ? 'text' : 'password'" v-model="inputPassword" placeholder="請輸入存取密碼" autofocus
                            class="w-full px-4 py-3.5 rounded-2xl bg-[#FAF8F5] border border-[#F0EAE1] focus:outline-none focus:ring-2 focus:ring-[#E07A5F] text-center text-lg tracking-widest font-mono text-[#4A4238]">
                        <button @click="showPassword = !showPassword" type="button" class="absolute right-4 top-4 text-[#9E9488] hover:text-[#4A4238] text-sm transition">
                            <i :class="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
                        </button>
                    </div>
                    <div v-if="lockError" class="text-rose-500 text-xs font-medium animate-bounce flex items-center justify-center gap-1">
                        <i class="fa-solid fa-circle-exclamation mr-1"></i> 密碼錯誤，請重新輸入 (預設 0527)
                    </div>
                    <button type="submit" class="w-full py-3.5 bg-[#E07A5F] hover:bg-[#D0694E] text-white font-bold rounded-2xl shadow-md shadow-[#E07A5F]/20 transition-all flex items-center justify-center space-x-2 active:scale-95">
                        <span>驗證解鎖</span>
                        <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    </button>
                </form>
                <div class="text-[11px] text-[#9E9488] pt-3 border-t border-[#F0EAE1] flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-shield-halved text-[#81B29A]"></i>
                    <span>資料儲存於本機瀏覽器，隱私安全無虞</span>
                </div>
            </div>
        </div>

        <!-- ================= MAIN APPLICATION UI ================= -->
        <template v-else>
            <header class="bg-white/90 backdrop-blur-md border-b border-[#F0EAE1] sticky top-0 z-30 no-print shadow-xs">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-2xl bg-[#FDF0ED] text-[#E07A5F] flex items-center justify-center shadow-xs font-bold text-xl border border-[#F8DCD4]">
                            🐱
                        </div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <h1 class="text-lg font-bold text-[#4A4238] tracking-tight">yuan 代辦事項</h1>
                                <span class="px-2 py-0.5 text-[11px] font-bold bg-[#FDF0ED] text-[#E07A5F] rounded-full border border-[#F8DCD4]">v3.0 Warm</span>
                            </div>
                            <p class="text-[11px] text-[#9E9488] hidden sm:block">智慧工作待辦與主任經費日誌管理系統</p>
                        </div>
                    </div>

                    <!-- Navigation Tabs & Actions -->
                    <div class="flex items-center space-x-2 sm:space-x-3">
                        <nav class="flex space-x-1 bg-[#FAF8F5] p-1 rounded-2xl border border-[#F0EAE1]">
                            <button @click="currentTab = 'daily'" :class="currentTab === 'daily' ? 'bg-white text-[#E07A5F] shadow-xs font-bold' : 'text-[#9E9488] hover:text-[#4A4238]'" class="px-3 py-1.5 rounded-xl text-xs sm:text-sm transition-all flex items-center space-x-1.5">
                                <i class="fa-solid fa-calendar-day"></i>
                                <span class="hidden sm:inline">日視圖</span>
                            </button>
                            <button @click="currentTab = 'all'" :class="currentTab === 'all' ? 'bg-white text-[#E07A5F] shadow-xs font-bold' : 'text-[#9E9488] hover:text-[#4A4238]'" class="px-3 py-1.5 rounded-xl text-xs sm:text-sm transition-all flex items-center space-x-1.5">
                                <i class="fa-solid fa-layer-group"></i>
                                <span class="hidden sm:inline">全覽與搜尋</span>
                            </button>
                            <button @click="currentTab = 'finance'" :class="currentTab === 'finance' ? 'bg-white text-[#E07A5F] shadow-xs font-bold' : 'text-[#9E9488] hover:text-[#4A4238]'" class="px-3 py-1.5 rounded-xl text-xs sm:text-sm transition-all flex items-center space-x-1.5">
                                <i class="fa-solid fa-calculator text-[#81B29A]"></i>
                                <span class="hidden sm:inline">經費對帳</span>
                            </button>
                        </nav>

                        <button @click="openExportModal()" class="px-3 py-2 text-xs sm:text-sm font-semibold text-[#81B29A] bg-[#F2F7F4] hover:bg-[#E3EFEA] border border-[#C8E0D5] rounded-xl transition flex items-center space-x-1.5">
                            <i class="fa-solid fa-file-export"></i>
                            <span class="hidden md:inline">匯出日誌</span>
                        </button>
                        
                        <button @click="openNewTaskModal()" class="px-3.5 py-2 text-xs sm:text-sm font-bold text-white bg-[#E07A5F] hover:bg-[#D0694E] rounded-xl shadow-xs transition flex items-center space-x-1.5 active:scale-95">
                            <i class="fa-solid fa-plus"></i>
                            <span class="hidden sm:inline">新增待辦</span>
                        </button>

                        <button @click="lockApp" title="安全鎖定" class="p-2 text-[#9E9488] hover:text-[#4A4238] rounded-xl hover:bg-[#FAF8F5] transition">
                            <i class="fa-solid fa-lock"></i>
                        </button>
                        <button @click="showModal = 'changePassword'" title="修改密碼" class="p-2 text-[#9E9488] hover:text-[#4A4238] rounded-xl hover:bg-[#FAF8F5] transition">
                            <i class="fa-solid fa-key"></i>
                        </button>
                    </div>
                </div>
            </header>

            <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6 no-print">

                <!-- CONTROLS, DATE SELECTOR & ROUTINE QUICK-IMPORTS -->
                <div class="bg-white rounded-3xl shadow-soft border border-[#F0EAE1] p-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div class="flex items-center space-x-2 w-full sm:w-auto">
                        <button @click="changeDate(-1)" class="p-2 text-[#9E9488] hover:bg-[#FAF8F5] hover:text-[#4A4238] rounded-xl transition">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <div class="relative flex-1 sm:flex-initial">
                            <input type="date" v-model="selectedDate" class="px-3 py-2 border border-[#F0EAE1] rounded-xl font-bold text-[#4A4238] bg-[#FAF8F5] focus:outline-none focus:ring-2 focus:ring-[#E07A5F] text-xs sm:text-sm w-full">
                        </div>
                        <button @click="changeDate(1)" class="p-2 text-[#9E9488] hover:bg-[#FAF8F5] hover:text-[#4A4238] rounded-xl transition">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                        <button @click="selectedDate = todayStr" class="px-3 py-2 text-xs font-bold bg-[#FDF0ED] hover:bg-[#F8DCD4] text-[#E07A5F] rounded-xl transition">
                            今天
                        </button>
                    </div>

                    <!-- Routine Tasks Quick Import Dropdown -->
                    <div class="flex items-center space-x-3 w-full sm:w-auto justify-end">
                        <div class="relative group">
                            <button class="bg-[#F2F7F4] hover:bg-[#E3EFEA] text-[#81B29A] border border-[#C8E0D5] px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-2xs">
                                <i class="fa-solid fa-bolt text-[#81B29A]"></i>
                                <span>帶入例行公事</span>
                                <i class="fa-solid fa-chevron-down text-[10px]"></i>
                            </button>
                            
                            <div class="absolute right-0 mt-1 w-64 bg-white border border-[#F0EAE1] rounded-2xl shadow-soft-lg z-20 hidden group-hover:block p-1.5 space-y-1">
                                <button @click="importRoutineTasks('daily')" class="w-full text-left px-3 py-2 rounded-xl text-xs text-[#4A4238] hover:bg-[#FDF0ED] flex items-center space-x-2 transition">
                                    <i class="fa-solid fa-sun text-[#E07A5F] text-base"></i>
                                    <div>
                                        <div class="font-bold">帶入每日例行 (2項)</div>
                                        <div class="text-[10px] text-[#9E9488]">設施檢核、紙本日常火源</div>
                                    </div>
                                </button>
                                <button @click="importRoutineTasks('monthly')" class="w-full text-left px-3 py-2 rounded-xl text-xs text-[#4A4238] hover:bg-[#F2F7F4] flex items-center space-x-2 transition">
                                    <i class="fa-solid fa-calendar-check text-[#81B29A] text-base"></i>
                                    <div>
                                        <div class="font-bold">帶入每月例行 (4項)</div>
                                        <div class="text-[10px] text-[#9E9488]">自主檢查、滅火器、火源、個資</div>
                                    </div>
                                </button>
                            </div>
                        </div>

                        <!-- Progress Bar (Daily View) -->
                        <div v-if="currentTab === 'daily'" class="flex items-center space-x-2 bg-[#FAF8F5] px-3 py-1.5 rounded-xl border border-[#F0EAE1]">
                            <span class="text-xs text-[#9E9488] font-medium">進度: <strong class="text-[#4A4238]">{{ dailyStats.completed }}/{{ dailyStats.total }}</strong></span>
                            <div class="w-20 bg-[#F0EAE1] rounded-full h-2 overflow-hidden">
                                <div class="bg-[#E07A5F] h-2 rounded-full transition-all duration-300" :style="{ width: dailyStats.percent + '%' }"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- CATEGORY & SEARCH FILTERS -->
                <div class="space-y-3">
                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="text-xs font-bold text-[#9E9488] uppercase tracking-wider mr-1">主業務:</span>
                            <button v-for="cat in businessCategories" :key="cat" @click="selectMainCategory(cat)"
                                :class="['px-3.5 py-1.5 rounded-xl text-xs font-bold transition', currentCategory === cat && !filterPendingApproval ? 'bg-[#4A4238] text-white shadow-xs' : 'bg-white text-[#4A4238] border border-[#F0EAE1] hover:bg-[#FAF8F5]']">
                                {{ cat }}
                            </button>

                            <!-- Supervisor Approval Quick Filter Button -->
                            <button @click="togglePendingApprovalFilter()"
                                :class="['px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ml-1', filterPendingApproval ? 'bg-[#9D81BA] text-white shadow-xs' : 'bg-[#F5F2F9] text-[#9D81BA] border border-[#E4DCEE] hover:bg-[#EDE7F4]']">
                                <i class="fa-solid fa-user-check"></i>
                                <span>待長官確認</span>
                                <span v-if="pendingApprovalCount > 0" class="px-1.5 py-0.2 rounded-full text-[10px] bg-white text-[#9D81BA] font-extrabold">
                                    {{ pendingApprovalCount }}
                                </span>
                            </button>
                        </div>

                        <!-- SEARCH BOX -->
                        <div class="relative w-full sm:w-72">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-xs text-[#9E9488]"></i>
                            <input type="text" v-model="searchQuery" placeholder="搜尋事項、會計代號、金額、傳票..."
                                class="w-full pl-9 pr-4 py-2 bg-white rounded-2xl border border-[#F0EAE1] text-xs focus:outline-none focus:ring-2 focus:ring-[#E07A5F] text-[#4A4238]">
                        </div>
                    </div>

                    <!-- Sub Category Pills -->
                    <div v-if="currentCategory !== '全部' && subCategoryOptions[currentCategory]" class="flex flex-wrap items-center gap-1.5 pl-3 border-l-2 border-[#E07A5F] bg-[#FDF0ED]/50 p-2 rounded-r-2xl text-xs">
                        <span class="font-medium text-[#9E9488] mr-1"><i class="fa-solid fa-filter text-[10px] mr-1"></i>細項:</span>
                        <button @click="currentSubCategory = '全部細項'"
                            :class="['px-2.5 py-1 rounded-lg text-[11px] font-bold transition', currentSubCategory === '全部細項' ? 'bg-[#E07A5F] text-white' : 'bg-white text-[#4A4238] border border-[#F0EAE1]']">
                            全部細項
                        </button>
                        <button v-for="sub in subCategoryOptions[currentCategory]" :key="sub" @click="currentSubCategory = sub"
                            :class="['px-2.5 py-1 rounded-lg text-[11px] font-bold transition', currentSubCategory === sub ? 'bg-[#E07A5F] text-white' : 'bg-white text-[#4A4238] border border-[#F0EAE1]']">
                            {{ sub }}
                        </button>
                    </div>
                </div>

                <!-- ================= FINANCIAL 4x4 MATRIX MODULE ================= -->
                <div v-if="currentTab === 'finance' || currentCategory === '經費管理'" class="space-y-6">
                    
                    <div class="bg-white rounded-3xl p-4 shadow-soft border border-[#F0EAE1] flex flex-wrap items-center justify-between gap-3">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold text-[#9E9488] uppercase tracking-wider">經費細項:</span>
                            <button v-for="sub in finSubCategories" :key="sub" @click="currentFinSubCategory = sub"
                                :class="['px-3 py-1.5 rounded-xl text-xs font-bold transition', currentFinSubCategory === sub ? 'bg-[#E07A5F] text-white shadow-xs' : 'bg-[#FAF8F5] text-[#4A4238] hover:bg-[#F0EAE1]']">
                                {{ sub }}
                            </button>
                        </div>

                        <div class="flex items-center space-x-2">
                            <div class="bg-[#FAF8F5] p-1 rounded-xl flex space-x-1 border border-[#F0EAE1]">
                                <button @click="financialViewMode = 'monthly'" :class="['px-2.5 py-1 text-xs font-bold rounded-lg transition', financialViewMode === 'monthly' ? 'bg-white text-[#4A4238] shadow-xs' : 'text-[#9E9488]']">
                                    當月對帳 ({{ currentMonthLabel }})
                                </button>
                                <button @click="financialViewMode = 'historical'" :class="['px-2.5 py-1 text-xs font-bold rounded-lg transition', financialViewMode === 'historical' ? 'bg-white text-[#4A4238] shadow-xs' : 'text-[#9E9488]']">
                                    歷年總累計對帳
                                </button>
                            </div>

                            <button @click="loadAicExcelSeedTasks" class="px-3 py-1.5 text-xs font-bold bg-[#F2F7F4] text-[#81B29A] hover:bg-[#E3EFEA] border border-[#C8E0D5] rounded-xl transition flex items-center space-x-1">
                                <i class="fa-solid fa-file-excel"></i>
                                <span>📥 載入 AIC 經費表全數明細</span>
                            </button>
                        </div>
                    </div>

                    <!-- 4x4 MATRIX RECONCILIATION TABLE -->
                    <div class="bg-white rounded-3xl shadow-soft border border-[#F0EAE1] overflow-hidden">
                        <div class="p-5 bg-[#4A4238] text-white flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                            <div>
                                <div class="flex items-center space-x-2">
                                    <h3 class="font-bold text-base">主任月費用 - 對帳結算矩陣表</h3>
                                    <span class="px-2.5 py-0.5 text-xs font-bold bg-[#E07A5F] text-white rounded-full">
                                        {{ financialViewMode === 'monthly' ? currentMonthLabel : '歷年全期總計' }}
                                    </span>
                                </div>
                                <p class="text-xs text-[#FAF8F5]/80 mt-0.5">跨單位四方歸屬 (醫院/中心/學校/外部) 支出與撥款自動試算</p>
                            </div>
                            <button @click="exportDirectorReport" class="px-3 py-1.5 text-xs font-bold bg-[#81B29A] hover:bg-[#6F9F88] text-white rounded-xl shadow-xs transition flex items-center space-x-1">
                                <i class="fa-solid fa-copy"></i>
                                <span>📄 複製主任專用對帳報表</span>
                            </button>
                        </div>

                        <div class="p-4 overflow-x-auto custom-scrollbar">
                            <table class="w-full text-xs text-left border-collapse">
                                <thead>
                                    <tr class="bg-[#FAF8F5] text-[#4A4238] font-bold border-b border-[#F0EAE1]">
                                        <th class="p-3 text-[#9E9488]">項目指標</th>
                                        <th class="p-3 text-center">醫院</th>
                                        <th class="p-3 text-center">中心</th>
                                        <th class="p-3 text-center">學校</th>
                                        <th class="p-3 text-center">外部</th>
                                        <th class="p-3 text-right font-extrabold text-[#4A4238] bg-[#FDF0ED]">合計</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-[#F0EAE1] font-medium text-[#4A4238]">
                                    <tr class="hover:bg-[#FAF8F5]">
                                        <td class="p-3 font-bold">待給對方 (主任實際支應費用)</td>
                                        <td class="p-3 text-center">{{ formatNumber(matrixData.pendingOther.醫院) }}</td>
                                        <td class="p-3 text-center">{{ formatNumber(matrixData.pendingOther.中心) }}</td>
                                        <td class="p-3 text-center">{{ formatNumber(matrixData.pendingOther.學校) }}</td>
                                        <td class="p-3 text-center">{{ formatNumber(matrixData.pendingOther.外部) }}</td>
                                        <td class="p-3 text-right font-bold bg-[#FDF0ED]/50">{{ formatNumber(matrixData.pendingOther.sum) }}</td>
                                    </tr>
                                    <tr class="hover:bg-[#FAF8F5] bg-[#FDF0ED]/30">
                                        <td class="p-3 text-[#E07A5F] font-bold">主任沒開銷，另申請給中心</td>
                                        <td class="p-3 text-center text-[#E07A5F]">{{ formatNumber(matrixData.directorNoExp.醫院) }}</td>
                                        <td class="p-3 text-center text-[#E07A5F] font-bold">{{ formatNumber(matrixData.directorNoExp.中心) }}</td>
                                        <td class="p-3 text-center text-[#E07A5F]">{{ formatNumber(matrixData.directorNoExp.學校) }}</td>
                                        <td class="p-3 text-center text-[#E07A5F]">{{ formatNumber(matrixData.directorNoExp.外部) }}</td>
                                        <td class="p-3 text-right font-extrabold text-[#E07A5F] bg-[#FDF0ED]">{{ formatNumber(matrixData.directorNoExp.sum) }}</td>
                                    </tr>
                                    <tr class="hover:bg-[#FAF8F5] bg-rose-50/40">
                                        <td class="p-3 text-rose-700 font-bold">支出 (待給主任代墊款)</td>
                                        <td class="p-3 text-center text-rose-600 font-semibold">{{ formatNumber(matrixData.expense.醫院) }}</td>
