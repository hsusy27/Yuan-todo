<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yuan  - 工作待辦與日誌匯出系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        korean: {
                            bg: '#FAF8F5',
                            card: '#FFFFFF',
                            border: '#F0EAE1',
                            text: '#4A4238',
                            muted: '#9E9488',
                            primary: '#E07A5F',
                            primarySoft: '#FDF0ED',
                            accent: '#81B29A',
                            accentSoft: '#F2F7F4'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', 'Inter', system-ui, -apple-system, sans-serif; }
        /* Print Styles for clean Work Log Exports */
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; color: black !important; }
            .print-card { border: 1px solid #e5e7eb !important; box-shadow: none !important; }
        }
        .print-only { display: none; }
        
        /* Auto link styling */
        .note-link { color: #d97706; font-weight: 500; text-decoration: underline; text-underline-offset: 2px; }
        .note-link:hover { color: #b45309; }
    </style>
</head>
<body class="bg-[#FAF8F5] dark:bg-stone-900 text-stone-700 dark:text-stone-200 min-h-screen flex flex-col transition-colors duration-200">

    <div id="app" class="flex-grow flex flex-col">
        
        <!-- ================= Security Lock Overlay ================= -->
        <div v-if="isLocked" class="fixed inset-0 bg-[#FAF8F5] dark:bg-stone-900 z-50 flex items-center justify-center p-4">
            <div class="max-w-md w-full bg-white dark:bg-stone-800 rounded-3xl p-8 shadow-xl border border-amber-100 dark:border-stone-700 text-center space-y-6">
                <!-- Cute Cat Header Icon -->
                <div class="w-20 h-20 bg-amber-100 dark:bg-amber-900/40 text-amber-600 dark:text-amber-300 rounded-3xl flex items-center justify-center mx-auto shadow-inner text-3xl">
                    <i class="fa-solid fa-cat"></i>
                </div>

                <div>
                    <h2 class="text-xl font-bold text-stone-800 dark:text-stone-100">yuan 代辦事項系統</h2>
                    <p class="text-xs text-stone-400 dark:text-stone-400 mt-1">請輸入存取密碼以進行驗證</p>
                </div>

                <!-- Password Input Form -->
                <div class="space-y-3">
                    <div class="relative">
                        <input :type="showPassword ? 'text' : 'password'" 
                               v-model="inputPassword" 
                               @keyup.enter="verifyPassword()"
                               placeholder="請輸入存取密碼" 
                               class="w-full text-center tracking-widest font-mono text-base px-4 py-3 rounded-2xl bg-stone-50 dark:bg-stone-900 border border-stone-200 dark:border-stone-700 focus:outline-none focus:ring-2 focus:ring-amber-400">
                        <button @click="showPassword = !showPassword" type="button" class="absolute right-4 top-3.5 text-stone-400 hover:text-stone-600 dark:hover:text-stone-200 text-sm">
                            <i :class="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
                        </button>
                    </div>

                    <div v-if="lockErrorMsg" class="text-xs text-rose-500 font-medium flex items-center justify-center gap-1">
                        <i class="fa-solid fa-circle-exclamation text-[10px]"></i>
                        <span>{{ lockErrorMsg }}</span>
                    </div>

                    <button @click="verifyPassword()" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-2xl text-sm transition shadow-xs hover:shadow active:scale-95">
                        驗證解鎖 🐾
                    </button>
                </div>

                <div class="text-[11px] text-stone-400 pt-2 border-t border-stone-100 dark:border-stone-700/60">
                    🔒 資料儲存於本機瀏覽器
                </div>
            </div>
        </div>

        <!-- ================= Main Application Interface ================= -->
        <template v-else>
            <!-- Top Navigation Header -->
            <header class="bg-white/90 dark:bg-stone-800/90 backdrop-blur-md border-b border-amber-100/80 dark:border-stone-700 sticky top-0 z-30 no-print shadow-xs">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <!-- Cute Cat Logo -->
                        <div class="w-10 h-10 rounded-2xl bg-amber-100/90 dark:bg-amber-900/40 border border-amber-200/60 dark:border-amber-700/50 flex items-center justify-center text-amber-600 dark:text-amber-300 shadow-xs transition-transform hover:scale-105">
                            <i class="fa-solid fa-cat text-xl"></i>
                        </div>
                        <div>
                            <h1 class="font-bold text-lg leading-none tracking-tight text-stone-800 dark:text-stone-100 flex items-center gap-1.5">
                                yuan 代辦事項
                                <span class="text-[10px] font-normal px-2 py-0.5 rounded-full bg-amber-100/80 text-amber-700 dark:bg-amber-900/50 dark:text-amber-300">🐾 Daily</span>
                            </h1>
                            <p class="text-xs text-stone-400 dark:text-stone-400 mt-0.5">清新工作待辦與日誌匯出</p>
                        </div>
                    </div>

                    <!-- Navigation Tabs & Actions -->
                    <div class="flex items-center space-x-2 sm:space-x-3">
                        <nav class="flex space-x-1 bg-stone-100/80 dark:bg-stone-700/60 p-1 rounded-2xl">
                            <button @click="currentTab = 'daily'" :class="currentTab === 'daily' ? 'bg-white dark:bg-stone-800 text-amber-700 dark:text-amber-300 shadow-xs font-semibold' : 'text-stone-500 dark:text-stone-300 hover:text-stone-800'" class="px-3 py-1.5 rounded-xl text-xs sm:text-sm transition-all flex items-center space-x-1.5">
                                <i class="fa-solid fa-calendar-day"></i>
                                <span class="hidden sm:inline">日視圖</span>
                            </button>
                            <button @click="currentTab = 'all'" :class="currentTab === 'all' ? 'bg-white dark:bg-stone-800 text-amber-700 dark:text-amber-300 shadow-xs font-semibold' : 'text-stone-500 dark:text-stone-300 hover:text-stone-800'" class="px-3 py-1.5 rounded-xl text-xs sm:text-sm transition-all flex items-center space-x-1.5">
                                <i class="fa-solid fa-layer-group"></i>
                                <span class="hidden sm:inline">全覽與搜尋</span>
                            </button>
                            <button @click="openExportModal()" class="px-3 py-1.5 rounded-xl text-xs sm:text-sm text-stone-600 dark:text-stone-300 hover:text-stone-900 hover:bg-stone-200/50 dark:hover:bg-stone-700 transition-all flex items-center space-x-1.5">
                                <i class="fa-solid fa-file-export text-emerald-500"></i>
                                <span class="font-medium text-emerald-600 dark:text-emerald-400">匯出日誌</span>
                            </button>
                        </nav>

                        <!-- Primary Action Buttons -->
                        <button @click="openTaskModal()" class="bg-amber-500 hover:bg-amber-600 text-white font-medium text-xs sm:text-sm px-3.5 py-2 rounded-2xl shadow-xs hover:shadow transition flex items-center space-x-1.5 active:scale-95">
                            <i class="fa-solid fa-plus"></i>
                            <span class="hidden sm:inline">新增待辦</span>
                        </button>

                        <!-- Lock Screen Button -->
                        <button @click="lockSystem()" title="鎖定系統" class="p-2 text-stone-400 hover:text-amber-600 hover:bg-amber-50 dark:hover:bg-stone-700 rounded-xl transition text-sm">
                            <i class="fa-solid fa-lock"></i>
                        </button>
                        
                        <!-- Change Password Button -->
                        <button @click="openChangePasswordModal()" title="修改密碼" class="p-2 text-stone-400 hover:text-amber-600 hover:bg-amber-50 dark:hover:bg-stone-700 rounded-xl transition text-sm">
                            <i class="fa-solid fa-key"></i>
                        </button>
                    </div>
                </div>
            </header>

            <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow no-print">
                
                <!-- Daily View Control Banner & Routine Quick Import -->
                <div v-if="currentTab === 'daily'" class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white dark:bg-stone-800 p-4 sm:p-5 rounded-2xl border border-stone-200/70 dark:border-stone-700 shadow-xs">
                    
                    <div class="flex flex-wrap items-center gap-3">
                        <div class="flex items-center space-x-2">
                            <button @click="changeDate(-1)" class="w-8 h-8 flex items-center justify-center rounded-xl border border-stone-200 dark:border-stone-700 hover:bg-stone-100 dark:hover:bg-stone-700 transition">
                                <i class="fa-solid fa-chevron-left text-xs text-stone-600 dark:text-stone-300"></i>
                            </button>
                            
                            <div class="flex items-center space-x-2 bg-amber-50/50 dark:bg-stone-900/50 px-3 py-1.5 rounded-xl border border-amber-100/60 dark:border-stone-700">
                                <i class="fa-regular fa-calendar text-amber-500 dark:text-amber-400 text-sm"></i>
                                <input type="date" v-model="selectedDate" class="font-bold text-stone-800 dark:text-stone-100 text-sm sm:text-base bg-transparent border-none focus:ring-0 cursor-pointer p-0">
                            </div>

                            <button @click="changeDate(1)" class="w-8 h-8 flex items-center justify-center rounded-xl border border-stone-200 dark:border-stone-700 hover:bg-stone-100 dark:hover:bg-stone-700 transition">
                                <i class="fa-solid fa-chevron-right text-xs text-stone-600 dark:text-stone-300"></i>
                            </button>

                            <button @click="setToday()" class="text-xs bg-amber-100/70 dark:bg-stone-700 text-amber-800 dark:text-amber-300 px-2.5 py-1.5 rounded-xl hover:bg-amber-200/70 transition font-medium border border-amber-200/50">
                                今天
                            </button>
                        </div>

                        <!-- Quick Routine Tasks Import Button -->
                        <div class="relative group">
                            <button class="bg-emerald-50 dark:bg-emerald-950/40 hover:bg-emerald-100/80 dark:hover:bg-emerald-900/50 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
                                <i class="fa-solid fa-bolt text-emerald-500"></i>
                                <span>帶入例行公事</span>
                                <i class="fa-solid fa-chevron-down text-[10px] text-emerald-500"></i>
                            </button>
                            
                            <!-- Dropdown Menu -->
                            <div class="absolute left-0 mt-1 w-56 bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded-2xl shadow-xl z-20 hidden group-hover:block p-1.5 space-y-1">
                                <button @click="importRoutineTasks('daily')" class="w-full text-left px-3 py-2 rounded-xl text-xs text-stone-700 dark:text-stone-200 hover:bg-amber-50 dark:hover:bg-stone-700 flex items-center space-x-2 transition">
                                    <i class="fa-solid fa-sun text-amber-500"></i>
                                    <div>
                                        <div class="font-semibold">帶入每日例行 (2項)</div>
                                        <div class="text-[10px] text-stone-400">設施檢核、紙本日常火源</div>
                                    </div>
                                </button>
                                <button @click="importRoutineTasks('monthly')" class="w-full text-left px-3 py-2 rounded-xl text-xs text-stone-700 dark:text-stone-200 hover:bg-amber-50 dark:hover:bg-stone-700 flex items-center space-x-2 transition">
                                    <i class="fa-solid fa-calendar-check text-indigo-500"></i>
                                    <div>
                                        <div class="font-semibold">帶入每月例行 (4項)</div>
                                        <div class="text-[10px] text-stone-400">自主檢查、滅火器、火源、個資</div>
                                    </div>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Daily Completion Progress Bar -->
                    <div class="flex items-center space-x-3 bg-amber-50/40 dark:bg-stone-900/50 px-4 py-2 rounded-2xl border border-amber-100/60 dark:border-stone-700/50">
                        <div class="text-xs text-stone-500">
                            當日進度: <span class="font-bold text-stone-800 dark:text-stone-200">{{ dailyStats.total > 0 ? dailyStats.completed : 0 }}/{{ dailyStats.total }} 項 ({{ dailyStats.total > 0 ? dailyStats.percent : 0 }}%)</span>
                        </div>
                        <div class="w-28 sm:w-36 bg-amber-100/60 dark:bg-stone-700 rounded-full h-2.5 overflow-hidden">
                            <div class="bg-gradient-to-r from-amber-400 to-emerald-400 h-2.5 rounded-full transition-all duration-300" :style="{ width: (dailyStats.total > 0 ? dailyStats.percent : 0) + '%' }"></div>
                        </div>
                    </div>
                </div>

                <!-- Category Filter Bar -->
                <div class="mb-6 space-y-3">
                    <div class="flex flex-wrap items-center gap-2">
                        <span class="text-xs font-semibold text-stone-400 uppercase tracking-wider mr-1">主業務:</span>
                        <button v-for="cat in mainCategories" :key="cat" @click="selectMainCategory(cat)" 
                            :class="filterCategory === cat && !filterPendingApproval ? 'bg-stone-800 text-white dark:bg-stone-100 dark:text-stone-900 font-semibold shadow-xs' : 'bg-white dark:bg-stone-800 text-stone-600 dark:text-stone-300 border border-stone-200/80 dark:border-stone-700 hover:bg-stone-100'" 
                            class="px-3.5 py-1.5 rounded-xl text-xs transition">
                            {{ cat === 'ALL' ? '全部' : cat }}
                        </button>

                        <!-- Quick Filter Button for Pending Supervisor Confirmations -->
                        <button @click="togglePendingApprovalFilter()" 
                            :class="filterPendingApproval ? 'bg-purple-600 text-white font-bold shadow-xs' : 'bg-purple-50 dark:bg-purple-950/40 text-purple-800 dark:text-purple-300 border border-purple-200 dark:border-purple-800 hover:bg-purple-100'" 
                            class="px-3.5 py-1.5 rounded-xl text-xs transition flex items-center gap-1.5 ml-auto sm:ml-2">
                            <i class="fa-solid fa-user-check"></i>
                            <span>待長官確認</span>
                            <span v-if="pendingApprovalCount > 0" class="px-1.5 py-0.2 rounded-full text-[10px] bg-purple-200 dark:bg-purple-800 text-purple-900 dark:text-purple-100 font-extrabold">
                                {{ pendingApprovalCount }}
                            </span>
                        </button>
                    </div>

                    <!-- Sub-category filter pills when a main category is selected -->
                    <div v-if="filterCategory !== 'ALL' && subCategoryOptions[filterCategory]" class="flex flex-wrap items-center gap-1.5 pl-3 border-l-2 border-amber-400 bg-amber-50/40 dark:bg-stone-800/50 p-2 rounded-r-2xl">
                        <span class="text-xs font-medium text-stone-500 dark:text-stone-400 mr-1"><i class="fa-solid fa-filter text-[10px] mr-1"></i>細項:</span>
                        <button @click="filterSubCategory = 'ALL'" 
                            :class="filterSubCategory === 'ALL' ? 'bg-amber-500 text-white font-medium' : 'bg-white dark:bg-stone-700 text-stone-600 dark:text-stone-300 border border-stone-200 dark:border-stone-600 hover:bg-stone-100'" 
                            class="px-2.5 py-1 rounded-lg text-[11px] transition">
                            全部細項
                        </button>
                        <button v-for="sub in subCategoryOptions[filterCategory]" :key="sub" @click="filterSubCategory = sub" 
                            :class="filterSubCategory === sub ? 'bg-amber-500 text-white font-medium' : 'bg-white dark:bg-stone-700 text-stone-600 dark:text-stone-300 border border-stone-200 dark:border-stone-600 hover:bg-stone-100'" 
                            class="px-2.5 py-1 rounded-lg text-[11px] transition">
                            {{ sub }}
                        </button>
                    </div>

                    <div class="relative w-full sm:w-64 pt-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-4 text-xs text-stone-400"></i>
                        <input type="text" v-model="searchQuery" placeholder="搜尋事項、核銷單、備註..." class="w-full pl-9 pr-3 py-2 text-xs rounded-2xl bg-white dark:bg-stone-800 border border-stone-200/80 dark:border-stone-700 focus:outline-none focus:ring-2 focus:ring-amber-400">
                    </div>
                </div>

                <!-- Empty State -->
                <div v-if="filteredTasks.length === 0" class="text-center py-16 bg-white dark:bg-stone-800 rounded-2xl border border-dashed border-stone-300 dark:border-stone-700 my-4">
                    <div class="w-16 h-16 bg-amber-50 dark:bg-stone-700 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-3">
                        <i class="fa-regular fa-clipboard text-2xl"></i>
                    </div>
                    <h3 class="text-base font-semibold text-stone-700 dark:text-stone-200">尚無相關待辦事項</h3>
                    <p class="text-xs text-stone-400 mt-1">點擊上方「新增待辦」或「帶入例行公事」開始安排工作吧！</p>
                    <div class="flex items-center justify-center gap-2 mt-4">
                        <button @click="importRoutineTasks('daily')" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-medium transition shadow-2xs">
                            <i class="fa-solid fa-bolt mr-1"></i>帶入每日例行
                        </button>
                        <button @click="openTaskModal()" class="px-3.5 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-medium transition shadow-2xs">
                            + 建立客製事項
                        </button>
                    </div>
                </div>

                <!-- Task List -->
                <div v-else class="space-y-3">
                    <div v-for="task in filteredTasks" :key="task.id" 
                        :class="[
                            'bg-white dark:bg-stone-800 rounded-2xl p-4 sm:p-5 border transition-all duration-200 shadow-xs hover:shadow-md flex flex-col md:flex-row md:items-start justify-between gap-4',
                            task.status === '已完成' ? 'border-stone-200 dark:border-stone-700/60 bg-stone-50/50 dark:bg-stone-800/40 opacity-75' : 'border-stone-200/80 dark:border-stone-700'
                        ]">
                        
                        <!-- Left Section: Status Checkbox & Details -->
                        <div class="flex items-start space-x-3.5 flex-grow">
                            <!-- Quick Complete Toggle -->
                            <button @click="toggleComplete(task)" class="mt-0.5 text-xl flex-shrink-0 transition transform active:scale-95">
                                <i v-if="task.status === '已完成'" class="fa-solid fa-circle-check text-emerald-500"></i>
                                <i v-else-if="task.status === '進行中'" class="fa-solid fa-spinner text-amber-500 animate-spin"></i>
                                <i v-else-if="task.status === '暫緩'" class="fa-solid fa-circle-pause text-stone-400"></i>
                                <i v-else class="fa-regular fa-circle text-stone-300 hover:text-amber-500 dark:text-stone-600"></i>
                            </button>

                            <div class="flex-grow min-w-0">
                                <!-- Title and Tags -->
                                <div class="flex flex-wrap items-center gap-2">
                                    <span :class="[
                                        'font-semibold text-sm sm:text-base break-words',
                                        task.status === '已完成' ? 'line-through text-stone-400 dark:text-stone-500' : 'text-stone-800 dark:text-stone-100'
                                    ]">
                                        {{ task.title }}
                                    </span>

                                    <!-- Approval Requirement Badge with Quick Action -->
                                    <div v-if="task.approvalStatus && task.approvalStatus !== '無'" class="flex items-center gap-1">
                                        <span :class="[
                                            task.approvalStatus === '已完成確認' 
                                                ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-300 border-emerald-200' 
                                                : 'bg-purple-100 text-purple-800 dark:bg-purple-900/50 dark:text-purple-300 border-purple-200',
                                            'border text-[10px] px-2.5 py-0.5 rounded-full font-bold flex items-center gap-1'
                                        ]">
                                            <i :class="task.approvalStatus === '已完成確認' ? 'fa-solid fa-circle-check' : 'fa-solid fa-user-clock'" class="text-[9px]"></i>
                                            {{ task.approvalStatus }}
                                        </span>
                                        
                                        <!-- Quick Confirm Toggle Button on Card -->
                                        <button v-if="task.approvalStatus === '需與組長確認' || task.approvalStatus === '需與主任確認'" 
                                            @click="quickConfirmApproval(task)" 
                                            title="點擊改為已完成確認"
                                            class="text-[10px] bg-purple-600 hover:bg-purple-700 text-white px-2 py-0.5 rounded-full font-medium transition flex items-center gap-0.5 shadow-2xs">
                                            <i class="fa-solid fa-check text-[8px]"></i>
                                            <span>完成確認</span>
                                        </button>
                                    </div>

                                    <!-- Priority Tag -->
                                    <span :class="getPriorityClass(task.priority)" class="text-[10px] px-2 py-0.5 rounded-full font-bold">
                                        {{ task.priority }}優先
                                    </span>

                                    <!-- Main Category Tag -->
                                    <span class="bg-amber-100/70 dark:bg-amber-900/30 text-amber-800 dark:text-amber-300 text-[10px] px-2.5 py-0.5 rounded-full font-semibold">
                                        {{ task.category }}
                                    </span>

                                    <!-- Sub Category Tag -->
                                    <span v-if="task.subCategory" class="bg-orange-50 dark:bg-orange-900/30 text-orange-700 dark:text-orange-300 text-[10px] px-2.5 py-0.5 rounded-full font-medium border border-orange-200/50 dark:border-orange-800/50">
                                        {{ task.subCategory }}
                                    </span>

                                    <!-- Date tag (if in ALL view) -->
                                    <span v-if="currentTab === 'all'" class="text-[11px] text-stone-400 bg-stone-100 dark:bg-stone-700/50 px-2 py-0.5 rounded-md">
                                        <i class="fa-regular fa-calendar text-[10px] mr-1"></i>{{ task.date }}
                                    </span>
                                </div>

                                <!-- EXPENSE WORKFLOW SPECIAL DISPLAY BOX -->
                                <div v-if="task.subCategory === '費用'" class="mt-2.5 bg-blue-50/70 dark:bg-blue-950/30 p-3 rounded-2xl border border-blue-100 dark:border-blue-900/50 space-y-2">
                                    <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
                                        <div class="flex items-center space-x-2 text-blue-900 dark:text-blue-200 font-semibold">
                                            <i class="fa-solid fa-file-invoice-dollar text-blue-600 dark:text-blue-400"></i>
                                            <span>費用核銷追蹤：</span>
                                            <span v-if="task.accountingDate" class="bg-white dark:bg-stone-800 px-2 py-0.5 rounded-lg text-[11px] border border-blue-200 text-blue-800 dark:text-blue-300">
                                                <i class="fa-solid fa-paper-plane mr-1 text-[10px]"></i>送會計室: {{ task.accountingDate }}
                                            </span>
                                            <span v-else class="text-[11px] text-stone-400 font-normal italic">未標記送會計日期</span>
                                        </div>

                                        <!-- Quick Expense Status Dropdown -->
                                        <div class="flex items-center space-x-1.5">
                                            <span class="text-[11px] text-blue-700 dark:text-blue-300 font-medium">當前核銷進度:</span>
                                            <select v-model="task.expenseStatus" @change="saveTasks()" class="text-xs bg-white dark:bg-stone-800 text-blue-900 dark:text-blue-200 border border-blue-200 dark:border-blue-800 rounded-xl px-2 py-1 font-bold focus:ring-1 focus:ring-blue-400 shadow-2xs">

                            <i class="fa-solid fa-print"></i>
                            <span>PDF / 列印預覽</span>
                        </button>
                        <button @click="exportCSV()" class="py-2.5 px-3 rounded-xl bg-emerald-600 text-white text-xs font-semibold hover:bg-emerald-700 flex items-center justify-center space-x-2 shadow-xs">
                            <i class="fa-solid fa-file-csv"></i>
                            <span>下載 CSV 表格</span>
                        </button>
                        <button @click="exportMarkdown()" class="py-2.5 px-3 rounded-xl bg-amber-500 text-white text-xs font-semibold hover:bg-amber-600 flex items-center justify-center space-x-2 shadow-xs">
                            <i class="fa-solid fa-copy"></i>
                            <span>複製 Markdown 格式</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- PRINT ONLY VIEW (Rendered for Window.print / PDF Export) -->
            <div class="print-only p-8 max-w-4xl mx-auto">
                <div class="text-center border-b pb-4 mb-6">
                    <h1 class="text-2xl font-bold text-stone-900">yuan 工作日誌報告</h1>
                    <p class="text-sm text-stone-600 mt-1">區間: {{ exportStartDate }} ~ {{ exportEndDate }} | 產出日期: {{ todayStr }}</p>
                </div>

                <!-- AI Summary section in Print if present -->
                <div v-if="aiSummaryText" class="mb-6 p-4 bg-stone-50 border rounded-xl">
                    <h3 class="font-bold text-sm text-stone-800 mb-1">【重點成果與執行摘要】</h3>
                    <p class="text-xs text-stone-700 whitespace-pre-line leading-relaxed">{{ aiSummaryText }}</p>
                </div>

                <!-- Task List Table for Print -->
                <table class="w-full text-left text-xs border-collapse">
                    <thead>
                        <tr class="bg-stone-100 border-b">
                            <th class="py-2 px-3 font-semibold">日期</th>
                            <th class="py-2 px-3 font-semibold">業務分類 (細項)</th>
                            <th class="py-2 px-3 font-semibold">事項名稱</th>
                            <th class="py-2 px-3 font-semibold">簽核需求</th>
                            <th class="py-2 px-3 font-semibold">進度/費用關卡</th>
                            <th class="py-2 px-3 font-semibold">備註與執行歷程</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y">
                        <tr v-for="t in exportTasksMatch" :key="t.id">
                            <td class="py-2 px-3 whitespace-nowrap">{{ t.date }}</td>
                            <td class="py-2 px-3 whitespace-nowrap font-medium">{{ t.category }} <span v-if="t.subCategory" class="text-stone-500">({{ t.subCategory }})</span></td>
                            <td class="py-2 px-3 font-medium">{{ t.title }}</td>
                            <td class="py-2 px-3 whitespace-nowrap">{{ t.approvalStatus && t.approvalStatus !== '無' ? t.approvalStatus : '-' }}</td>
                            <td class="py-2 px-3 whitespace-nowrap">
                                <div>{{ t.status }}</div>
                                <div v-if="t.subCategory === '費用'" class="text-[10px] text-blue-700 font-semibold">
                                    送會計: {{ t.accountingDate || '未定' }} | 關卡: {{ t.expenseStatus || '已開立' }}
                                </div>
                            </td>
                            <td class="py-2 px-3">
                                <div>{{ t.notes || '-' }}</div>
                                <div v-if="t.history && t.history.length > 0" class="mt-1 pt-1 border-t border-stone-200 text-[10px] text-stone-600 space-y-0.5">
                                    <div class="font-bold text-stone-700">執行歷程：</div>
                                    <div v-for="h in t.history" :key="h.id">
                                        • <span class="font-mono">{{ h.timestamp }}</span>: {{ h.content }}
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class="mt-8 pt-4 border-t flex justify-between text-[11px] text-stone-500">
                    <span>報告核閱簽章：__________________</span>
                    <span>yuan 代辦事項系統自動生成</span>
                </div>
            </div>
        </template>

        <!-- Toast Message Notification -->
        <div v-if="toastMsg" class="fixed bottom-5 right-5 bg-stone-900 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl z-50 no-print flex items-center space-x-2 animate-bounce">
            <i class="fa-solid fa-circle-check text-emerald-400"></i>
            <span>{{ toastMsg }}</span>
        </div>

    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        createApp({
            setup() {
                // System Security Password Management
                const DEFAULT_PASS = '0527';
                const PASS_KEY = 'yuan_todo_app_pass_v1';
                const isLocked = ref(true);
                const inputPassword = ref('');
                const showPassword = ref(false);
                const lockErrorMsg = ref('');
                const showChangePasswordModal = ref(false);
                const newPasswordInput = ref('');

                const getSavedPassword = () => {
                    return localStorage.getItem(PASS_KEY) || DEFAULT_PASS;
                };

                const verifyPassword = () => {
                    const saved = getSavedPassword();
                    if (inputPassword.value === saved) {
                        isLocked.value = false;
                        inputPassword.value = '';
                        lockErrorMsg.value = '';
                        showToast('解鎖成功 🐾');
                    } else {
                        lockErrorMsg.value = '密碼不正確，請重新輸入';
                    }
                };

                const lockSystem = () => {
                    isLocked.value = true;
                    showToast('系統已安全鎖定');
                };

                const openChangePasswordModal = () => {
                    newPasswordInput.value = '';
                    showChangePasswordModal.value = true;
                };

                const saveNewPassword = () => {
                    if (!newPasswordInput.value.trim()) {
                        showToast('密碼不能為空');
                        return;
                    }
                    localStorage.setItem(PASS_KEY, newPasswordInput.value.trim());
                    showChangePasswordModal.value = false;
                    showToast('存取密碼已成功變更！');
                };

                // Date Helpers
                const getTodayStr = () => new Date().toISOString().split('T')[0];
                const getNowFormatted = () => {
                    const d = new Date();
                    const month = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    const hours = String(d.getHours()).padStart(2, '0');
                    const mins = String(d.getMinutes()).padStart(2, '0');
                    return `${month}/${day} ${hours}:${mins}`;
                };

                const todayStr = getTodayStr();

                // Navigation State
                const currentTab = ref('daily');
                const selectedDate = ref(todayStr);
                const searchQuery = ref('');
                const filterCategory = ref('ALL');
                const filterSubCategory = ref('ALL');
                const filterPendingApproval = ref(false);
                const toastMsg = ref('');

                // Quick execution history tracking
                const quickLogs = ref({});
                const expandedHistory = ref({});

                // Expense Workflow Steps Definitions
                const expenseSteps = ['已開立', '會計確認', '開立費用彙總', '費用轉傳票', '出納通知匯款', '完成'];

                // Check if an expense step is active/completed
                const isExpenseStepActive = (currentStatus, step) => {
                    const curStatus = currentStatus || '已開立';
                    const curIndex = expenseSteps.indexOf(curStatus);
                    const stepIndex = expenseSteps.indexOf(step);
                    if (curIndex === -1 || stepIndex === -1) return false;
                    return stepIndex <= curIndex;
                };

                // Custom Business Taxonomy definitions
                const mainCategories = ref(['ALL', '行政業務', '人事業務', 'QMS']);
                const subCategoryOptions = {
                    '行政業務': ['公文', '一般庶務', '費用'],
                    '人事業務': ['聘任 (醫院)', '聘任 (學校)', '續聘 (醫院)', '續聘 (學校)', '面試邀約', '履歷下載'],
                    'QMS': ['日常稽核', '文件管制', '矯正預防', '其他']
                };

                // Defined Preset Routine Templates
                const dailyRoutineTemplates = [
                    {
                        title: '每日線上填寫單位設施檢核表',
                        category: '行政業務',
                        subCategory: '一般庶務',
                        priority: '高',
                        approvalStatus: '無',
                        notes: '線上系統網址: https://his.cmuh.org.tw/webapp/app/'
                    },
                    {
                        title: '每日紙本日常火源表格填寫',
                        category: '行政業務',
                        subCategory: '一般庶務',
                        priority: '高',
                        approvalStatus: '無',
                        notes: '務必每日完成，備查用。'
                    }
                ];

                const monthlyRoutineTemplates = [
                    {
                        title: '每月自主檢查表填寫',
                        category: '行政業務',
                        subCategory: '一般庶務',
                        priority: '中',
                        approvalStatus: '無',
                        notes: '線上系統網址: https://his.cmuh.org.tw/webapp/app/'
                    },
                    {
                        title: '每月乾粉滅火器檢查卡填寫(5+2+2)',
                        category: '行政業務',
                        subCategory: '一般庶務',
                        priority: '中',
                        approvalStatus: '無',
                        notes: '請至各樓層核對實體滅火器並填卡。'
                    },
                    {
                        title: '紙本日常火源表格填寫 (每月提交/棟長工務室3F/用印完成各單位留存)',
                        category: '行政業務',
                        subCategory: '一般庶務',
                        priority: '高',
                        approvalStatus: '需與組長確認',
                        notes: '⚠️ 職安查核重點項目！用印完成後各單位自行留存備查。'
                    },
                    {
                        title: '每月個資保護檢核表上傳',
                        category: 'QMS',
                        subCategory: '文件管制',
                        priority: '中',
                        approvalStatus: '無',
                        notes: '定期完成個資稽核表單上傳程序。'
                    }
                ];

                // Tasks Data
                const tasks = ref([]);

                // LocalStorage Management
                const STORAGE_KEY = 'yuan_todo_tasks_v2';

                const saveTasks = () => {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks.value));
                };

                const loadTasks = () => {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        try {
                            tasks.value = JSON.parse(saved);
                        } catch (e) {
                            console.error(e);
                            initDefaultTasks();
                        }
                    } else {
                        initDefaultTasks();
                    }
                };

                const initDefaultTasks = () => {
                    tasks.value = [
                        {
                            id: '1',
                            title: '每日線上填寫單位設施檢核表',
                            date: todayStr,
                            category: '行政業務',
                            subCategory: '一般庶務',
                            priority: '高',
                            status: '進行中',
                            approvalStatus: '無',
                            accountingDate: '',
                            expenseStatus: '已開立',
                            notes: '線上系統網址: https://his.cmuh.org.tw/webapp/app/',
                            history: [
                                { id: '101', timestamp: getNowFormatted(), content: '系統預載例行事項' }
                            ]
                        },
                        {
                            id: '2',
                            title: '8月份計程車費與出差費用核銷單提交',
                            date: todayStr,
                            category: '行政業務',
                            subCategory: '費用',
                            priority: '高',
                            status: '進行中',
                            approvalStatus: '需與組長確認',
                            accountingDate: todayStr,
                            expenseStatus: '會計確認',
                            notes: '單據已整理齊全，待組長核章後送出。',
                            history: [
                                { id: '201', timestamp: getNowFormatted(), content: '已填寫核銷單並黏貼憑證' }
                            ]
                        }
                    ];
                    saveTasks();
                };

                // Daily Stats
                const dailyStats = computed(() => {
                    const dayTasks = tasks.value.filter(t => t.date === selectedDate.value);
                    const total = dayTasks.length;
                    const completed = dayTasks.filter(t => t.status === '已完成').length;
                    const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
                    return { total, completed, percent };
                });

                // Count of items pending supervisor approval
                const pendingApprovalCount = computed(() => {
                    return tasks.value.filter(t => {
                        if (currentTab.value === 'daily' && t.date !== selectedDate.value) return false;
                        return t.approvalStatus === '需與組長確認' || t.approvalStatus === '需與主任確認';
                    }).length;
                });

                const togglePendingApprovalFilter = () => {
                    filterPendingApproval.value = !filterPendingApproval.value;
                    if (filterPendingApproval.value) {
                        filterCategory.value = 'ALL';
                        filterSubCategory.value = 'ALL';
                        showToast('已開啟「待長官確認」快速彙報視圖');
                    }
                };

                const quickConfirmApproval = (task) => {
                    task.approvalStatus = '已完成確認';
                    if (!task.history) task.history = [];
                    task.history.push({
                        id: Date.now().toString(),
                        timestamp: getNowFormatted(),
                        content: '完成長官確認步驟。'
                    });
                    saveTasks();
                    showToast('已更新為：已完成確認');
                };

                const selectMainCategory = (cat) => {
                    filterCategory.value = cat;
                    filterSubCategory.value = 'ALL';
                    filterPendingApproval.value = false;
                };

                // Priority rank lookup helper
                const priorityWeight = { '高': 1, '中': 2, '低': 3 };

                const filteredTasks = computed(() => {
                    return tasks.value.filter(t => {
                        if (currentTab.value === 'daily' && t.date !== selectedDate.value) return false;
                        
                        if (filterPendingApproval.value) {
                            if (t.approvalStatus !== '需與組長確認' && t.approvalStatus !== '需與主任確認') return false;
                        }

                        if (filterCategory.value !== 'ALL' && t.category !== filterCategory.value) return false;
                        if (filterSubCategory.value !== 'ALL' && t.subCategory !== filterSubCategory.value) return false;
                        if (searchQuery.value.trim()) {
                            const q = searchQuery.value.toLowerCase();
                            const matchTitle = t.title.toLowerCase().includes(q);
                            const matchNotes = (t.notes || '').toLowerCase().includes(q);
                            const matchSub = (t.subCategory || '').toLowerCase().includes(q);
                            const matchAppr = (t.approvalStatus || '').toLowerCase().includes(q);
                            const matchExp = (t.expenseStatus || '').toLowerCase().includes(q);
                            const matchAcc = (t.accountingDate || '').toLowerCase().includes(q);
                            const matchHistory = (t.history || []).some(h => h.content.toLowerCase().includes(q));
                            if (!matchTitle && !matchNotes && !matchSub && !matchAppr && !matchExp && !matchAcc && !matchHistory) return false;
                        }
                        return true;
                    }).sort((a, b) => {
                        // Level 1: Strict Completed Status Check (0 = Active, 1 = Completed)
                        const aDone = a.status === '已完成' ? 1 : 0;
                        const bDone = b.status === '已完成' ? 1 : 0;
                        if (aDone !== bDone) {
                            return aDone - bDone; // Active (0) moves up, Completed (1) moves down
                        }

                        // Level 2: Priority Rank
                        const aPrio = priorityWeight[a.priority] || 2;
                        const bPrio = priorityWeight[b.priority] || 2;
                        return aPrio - bPrio;
                    });
                });

                // Task Modals & Forms
                const showTaskModal = ref(false);
                const editingTaskId = ref(null);
                const formTask = ref({
                    title: '',
                    date: todayStr,
                    category: '行政業務',
                    subCategory: '一般庶務',
                    priority: '中',
                    status: '未開始',
                    approvalStatus: '無',
                    accountingDate: '',
                    expenseStatus: '已開立',
                    notes: '',
                    history: []
                });

                const onCategoryChange = () => {
                    const subs = subCategoryOptions[formTask.value.category] || [];
                    formTask.value.subCategory = subs[0] || '';
                };

                const openTaskModal = (task = null) => {
                    if (task) {
                        editingTaskId.value = task.id;
                        formTask.value = JSON.parse(JSON.stringify(task));
                        if (!formTask.value.history) formTask.value.history = [];
                        if (!formTask.value.approvalStatus) formTask.value.approvalStatus = '無';
                        if (!formTask.value.expenseStatus) formTask.value.expenseStatus = '已開立';
                        if (!formTask.value.accountingDate) formTask.value.accountingDate = '';
                    } else {
                        editingTaskId.value = null;
                        const defaultMain = filterCategory.value !== 'ALL' ? filterCategory.value : '行政業務';
                        const defaultSub = subCategoryOptions[defaultMain]?.[0] || '一般庶務';
                        formTask.value = {
                            title: '',
                            date: selectedDate.value,
                            category: defaultMain,
                            subCategory: defaultSub,
                            priority: '中',
                            status: '未開始',
                            approvalStatus: '無',
                            accountingDate: '',
                            expenseStatus: '已開立',
                            notes: '',
                            history: []
                        };
                    }
                    showTaskModal.value = true;
                };

                const editTask = (task) => {
                    openTaskModal(task);
                };

                const saveFormTask = () => {
                    if (!formTask.value.title.trim()) {
                        showToast('請輸入事項標題');
                        return;
                    }
                    if (editingTaskId.value) {
                        const index = tasks.value.findIndex(t => t.id === editingTaskId.value);
                        if (index !== -1) {
                            tasks.value[index] = { ...formTask.value, id: editingTaskId.value };
                        }
                    } else {
                        const newId = Date.now().toString();
                        tasks.value.unshift({
                            ...formTask.value,
                            id: newId
                        });
                        expandedHistory.value[newId] = true;
                    }
                    saveTasks();
                    showTaskModal.value = false;
                    showToast(editingTaskId.value ? '已更新待辦事項' : '已新增待辦事項');
                };

                const toggleComplete = (task) => {
                    task.status = task.status === '已完成' ? '未開始' : '已完成';
                    saveTasks();
                };

                const moveToTomorrow = (task) => {
                    const d = new Date(task.date);
                    d.setDate(d.getDate() + 1);
                    task.date = d.toISOString().split('T')[0];
                    saveTasks();
                    showToast('已將事項移至明天');
                };

                const deleteTask = (id) => {
                    tasks.value = tasks.value.filter(t => t.id !== id);
                    saveTasks();
                    showToast('已刪除待辦事項');
                };

                const changeDate = (days) => {
                    const d = new Date(selectedDate.value);
                    d.setDate(d.getDate() + days);
                    selectedDate.value = d.toISOString().split('T')[0];
                };

                const setToday = () => {
                    selectedDate.value = todayStr;
                };

                const getPriorityClass = (priority) => {
                    if (priority === '高') return 'bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-300 border border-rose-200/80 dark:border-rose-800';
                    if (priority === '中') return 'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300 border border-amber-200/80 dark:border-amber-800';
                    return 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300 border border-emerald-200/80 dark:border-emerald-800';
                };

                const toggleTaskHistory = (taskId) => {
                    expandedHistory.value[taskId] = !expandedHistory.value[taskId];
                };

                const addQuickLog = (task) => {
                    const text = (quickLogs.value[task.id] || '').trim();
                    if (!text) return;
                    if (!task.history) task.history = [];
                    task.history.unshift({
                        id: Date.now().toString(),
                        timestamp: getNowFormatted(),
                        content: text
                    });
                    quickLogs.value[task.id] = '';
                    saveTasks();
                    showToast('已追加執行歷程');
                };

                const deleteHistoryLog = (task, logId) => {
                    if (task.history) {
                        task.history = task.history.filter(h => h.id !== logId);
                        saveTasks();
                        showToast('已刪除該筆歷程');
                    }
                };

                const deleteModalHistoryLog = (logId) => {
                    if (formTask.value.history) {
                        formTask.value.history = formTask.value.history.filter(h => h.id !== logId);
                    }
                };

                const importRoutineTasks = (type) => {
                    const listToImport = type === 'daily' ? dailyRoutineTemplates : monthlyRoutineTemplates;
                    let addedCount = 0;
                    listToImport.forEach(tmpl => {
                        const exists = tasks.value.some(t => t.date === selectedDate.value && t.title === tmpl.title);
                        if (!exists) {
                            const newId = Date.now().toString() + Math.random().toString(36).substr(2, 4);
                            tasks.value.unshift({
                                id: newId,
                                title: tmpl.title,
                                date: selectedDate.value,
                                category: tmpl.category,
                                subCategory: tmpl.subCategory,
                                priority: tmpl.priority,
                                status: '未開始',
                                approvalStatus: tmpl.approvalStatus || '無',
                                accountingDate: '',
                                expenseStatus: '已開立',
                                notes: tmpl.notes || '',
                                history: [
                                    {
                                        id: Date.now().toString(),
                                        timestamp: getNowFormatted(),
                                        content: '帶入例行公事項目'
                                    }
                                ]
                            });
                            addedCount++;
                        }
                    });
                    saveTasks();
                    showToast(`已成功帶入 ${addedCount} 項例行公事`);
                };

                const renderNotesWithLinks = (text) => {
                    if (!text) return '';
                    const urlRegex = /(https?:\/\/[^\s]+)/g;
                    return text.replace(urlRegex, (url) => {
                        return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="note-link">${url} <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i></a>`;
                    });
                };

                // Export Modal State & Logic
                const showExportModal = ref(false);
                const exportStartDate = ref(todayStr);
                const exportEndDate = ref(todayStr);
                const exportOnlyCompleted = ref(false);
                const exportIncludeNotes = ref(true);
                const aiSummaryText = ref('');
                const isGeneratingAI = ref(false);

                const exportTasksMatch = computed(() => {
                    return tasks.value.filter(t => {
                        if (t.date < exportStartDate.value || t.date > exportEndDate.value) return false;
                        if (exportOnlyCompleted.value && t.status !== '已完成') return false;
                        return true;
                    }).sort((a, b) => a.date.localeCompare(b.date));
                });

                const openExportModal = () => {
                    exportStartDate.value = selectedDate.value;
                    exportEndDate.value = selectedDate.value;
                    aiSummaryText.value = '';
                    showExportModal.value = true;
                };

                const setExportRange = (range) => {
                    const now = new Date();
                    if (range === 'today') {
                        exportStartDate.value = todayStr;
                        exportEndDate.value = todayStr;
                    } else if (range === 'week') {
                        const first = now.getDate() - now.getDay();
                        const last = first + 6;
                        exportStartDate.value = new Date(now.setDate(first)).toISOString().split('T')[0];
                        exportEndDate.value = new Date(now.setDate(last)).toISOString().split('T')[0];
                    } else if (range === 'month') {
                        const y = now.getFullYear();
                        const m = now.getMonth();
                        exportStartDate.value = new Date(y, m, 1).toISOString().split('T')[0];
                        exportEndDate.value = new Date(y, m + 1, 0).toISOString().split('T')[0];
                    }
                };

                const exportPDF = () => {
                    window.print();
                };

                // Generate AI Summary using Gemini API
                const generateAISummary = async () => {
                    if (exportTasksMatch.value.length === 0) {
                        showToast('無可供 AI 摘要的待辦資料');
                        return;
                    }

                    isGeneratingAI.value = true;
                    try {
                        const itemsFormatted = exportTasksMatch.value.map(t => {
                            let itemStr = `- [${t.date}][${t.category}${t.subCategory ? ' - ' + t.subCategory : ''}][狀態:${t.status}] ${t.title}`;
                            if (t.approvalStatus && t.approvalStatus !== '無') {
                                itemStr += ` [簽核需求: ${t.approvalStatus}]`;
                            }
                            if (t.subCategory === '費用') {
                                itemStr += ` [費用核銷: 送會計日 ${t.accountingDate || '未定'}, 進度: ${t.expenseStatus || '已開立'}]`;
                            }
                            if (t.notes) itemStr += ` (備註: ${t.notes})`;
                            if (t.history && t.history.length > 0) {
                                const histStr = t.history.map(h => `[${h.timestamp}] ${h.content}`).join('; ');
                                itemStr += ` [執行歷程: ${histStr}]`;
                            }
                            return itemStr;
                        }).join('\n');

                        const userPrompt = `請協助整理以下工作日誌，包含簽核狀態、費用核銷進度與詳細執行歷程，並產出一份簡短、條理清晰且適合回報給主管的「工作重點摘要與成果總結」（約 150 - 200 字，繁體中文）：\n\n${itemsFormatted}`;

                        const apiKey = "";
                        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: userPrompt }] }],
                                systemInstruction: {
                                    parts: [{ text: "你是一位高效率的高級行政與人事業務特務助手，擅長精煉專業工作報告。" }]
                                }
                            })
                        });

                        const result = await response.json();
                        const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (text) {
                            aiSummaryText.value = text.trim();
                            showToast('AI 摘要生成完成');
                        } else {
                            aiSummaryText.value = "無法生成摘要，請稍後再試。";
                        }
                    } catch (e) {
                        aiSummaryText.value = "AI 生成過程中發生錯誤。";
                    } finally {
                        isGeneratingAI.value = false;
                    }
                };

                // CSV Export
                const exportCSV = () => {
                    let csv = '\uFEFF';
                    csv += '日期,主分類,細項分類,事項名稱,優先等級,主管簽核需求,進度狀態,送會計室日期,費用核銷進度,備註與細節,執行歷程細節\n';

                    exportTasksMatch.value.forEach(t => {
                        const cleanTitle = `"${(t.title || '').replace(/"/g, '""')}"`;
                        const cleanNotes = `"${(t.notes || '').replace(/"/g, '""')}"`;
                        const historyFormatted = (t.history || []).map(h => `[${h.timestamp}] ${h.content}`).join(' | ');
                        const cleanHistory = `"${historyFormatted.replace(/"/g, '""')}"`;
                        const approval = t.approvalStatus || '無';
                        const accDate = t.accountingDate || '';
                        const expStatus = t.subCategory === '費用' ? (t.expenseStatus || '已開立') : '';
                        
                        csv += `${t.date},${t.category},${t.subCategory || ''},${cleanTitle},${t.priority},${approval},${t.status},${accDate},${expStatus},${cleanNotes},${cleanHistory}\n`;
                    });

                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.setAttribute('href', url);
                    link.setAttribute('download', `工作日誌_${exportStartDate.value}_至_${exportEndDate.value}.csv`);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast('CSV 下載成功');
                };

                // Markdown Export to Clipboard
                const exportMarkdown = () => {
                    let md = `# 📋 工作日誌報告 (${exportStartDate.value} ~ ${exportEndDate.value})\n\n`;

                    if (aiSummaryText.value) {
                        md += `### 💡 AI 工作摘要\n${aiSummaryText.value}\n\n`;
                    }

                    md += `### 📝 事項與執行歷程清單\n`;
                    exportTasksMatch.value.forEach(t => {
                        const icon = t.status === '已完成' ? '✅' : '⏳';
                        const subStr = t.subCategory ? ` · ${t.subCategory}` : '';
                        const apprStr = t.approvalStatus && t.approvalStatus !== '無' ? ` | 👥 ${t.approvalStatus}` : '';
                        md += `- ${icon} **[${t.category}${subStr}]** ${t.title} (${t.priority}優先 | ${t.status}${apprStr})\n`;
                        
                        if (t.subCategory === '費用') {
                            md += `  > 🧾 費用核銷: 送會計日 ${t.accountingDate || '未定'} | 關卡: ${t.expenseStatus || '已開立'}\n`;
                        }
                        if (exportIncludeNotes.value && t.notes) {
                            md += `  > 備註: ${t.notes}\n`;
                        }
                        if (t.history && t.history.length > 0) {
                            t.history.forEach(h => {
                                md += `  - 🕒 \`${h.timestamp}\` ${h.content}\n`;
                            });
                        }
                    });

                    copyText(md);
                    showToast('已複製 Markdown 至剪貼簿');
                };

                const copyText = (text) => {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                };

                const showToast = (msg) => {
                    toastMsg.value = msg;
                    setTimeout(() => { toastMsg.value = ''; }, 3000);
                };

                onMounted(() => {
                    loadTasks();
                });

                return {
                    isLocked,
                    inputPassword,
                    showPassword,
                    lockErrorMsg,
                    showChangePasswordModal,
                    newPasswordInput,
                    verifyPassword,
                    lockSystem,
                    openChangePasswordModal,
                    saveNewPassword,
                    currentTab,
                    selectedDate,
                    searchQuery,
                    filterCategory,
                    filterSubCategory,
                    filterPendingApproval,
                    pendingApprovalCount,
                    togglePendingApprovalFilter,
                    quickConfirmApproval,
                    mainCategories,
                    subCategoryOptions,
                    expenseSteps,
                    isExpenseStepActive,
                    selectMainCategory,
                    onCategoryChange,
                    tasks,
                    filteredTasks,
                    dailyStats,
                    showTaskModal,
                    editingTaskId,
                    formTask,
                    showExportModal,
                    exportStartDate,
                    exportEndDate,
                    exportOnlyCompleted,
                    exportIncludeNotes,
                    exportTasksMatch,
                    aiSummaryText,
                    isGeneratingAI,
                    quickLogs,
                    expandedHistory,
                    toggleTaskHistory,
                    addQuickLog,
                    deleteHistoryLog,
                    deleteModalHistoryLog,
                    importRoutineTasks,
                    renderNotesWithLinks,
                    toastMsg,
                    todayStr,
                    changeDate,
                    setToday,
                    openTaskModal,
                    editTask,
                    saveFormTask,
                    toggleComplete,
                    moveToTomorrow,
                    deleteTask,
                    saveTasks,
                    getPriorityClass,
                    openExportModal,
                    setExportRange,
                    generateAISummary,
                    exportPDF,
                    exportCSV,
                    exportMarkdown,
                    copyText
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
